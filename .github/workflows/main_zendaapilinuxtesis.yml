# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - zendaapilinuxtesis

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install and build
        run: |
          npm install
          npm run build --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .
          # upload-artifact@v4 excludes hidden files by default. The Prisma
          # client is generated into node_modules/.prisma/ (a dot-dir) by the
          # postinstall `prisma generate`, so without this it is dropped from
          # the package and the app crashes at boot with
          # "Cannot find module '.prisma/client/default'".
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4AC0CB231AE641608C9DD825D4D84C57 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0B69A87B0876401CA7461A4D701E7C1E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E67BAFDB17C94FBFAEFD3D0EBDA7B75C }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'zendaapilinuxtesis'
          slot-name: 'Production'
          package: .

      - name: Seed isolated illustrative research cohort once
        shell: bash
        run: |
          set -euo pipefail

          resource_group="$(az webapp list \
            --query "[?name=='zendaapilinuxtesis'].resourceGroup | [0]" \
            --output tsv)"
          default_hostname="$(az webapp show \
            --name zendaapilinuxtesis \
            --resource-group "$resource_group" \
            --query defaultHostName \
            --output tsv)"
          original_startup="$(az webapp config show \
            --name zendaapilinuxtesis \
            --resource-group "$resource_group" \
            --query appCommandLine \
            --output tsv)"

          if [ -z "$resource_group" ] || [ -z "$default_hostname" ]; then
            echo "Azure Web App metadata was not found."
            exit 1
          fi

          restore_startup() {
            az webapp config set \
              --name zendaapilinuxtesis \
              --resource-group "$resource_group" \
              --startup-file "$original_startup" \
              --output none
          }

          wait_for_state() {
            expected_state="$1"
            for attempt in $(seq 1 40); do
              current_state="$(az webapp show \
                --name zendaapilinuxtesis \
                --resource-group "$resource_group" \
                --query state \
                --output tsv)"
              if [ "$current_state" = "$expected_state" ]; then
                return 0
              fi
              echo "Waiting for Azure state $expected_state ($attempt/40; current: $current_state)..."
              sleep 5
            done
            return 1
          }

          wait_until_live() {
            for attempt in $(seq 1 40); do
              if curl --fail --silent --show-error \
                --max-time 20 \
                "https://$default_hostname/api/live" >/dev/null; then
                return 0
              fi
              echo "Waiting for Azure Web App health ($attempt/40)..."
              sleep 15
            done
            return 1
          }

          trap restore_startup EXIT

          az webapp stop \
            --name zendaapilinuxtesis \
            --resource-group "$resource_group" \
            --output none
          wait_for_state Stopped

          az webapp config set \
            --name zendaapilinuxtesis \
            --resource-group "$resource_group" \
            --startup-file "bash -c 'export ALLOW_ILLUSTRATIVE_RESEARCH_SEED=true; npm run prisma:seed:research-scenario && exec npm run start:prod'" \
            --output none
          az webapp start \
            --name zendaapilinuxtesis \
            --resource-group "$resource_group" \
            --output none
          wait_for_state Running

          sleep 60
          wait_until_live
          echo "Illustrative research cohort seed completed and self-validated."

          restore_startup
          trap - EXIT
          sleep 20
          wait_until_live

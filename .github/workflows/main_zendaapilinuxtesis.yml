# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - zendaapilinuxtesis

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install and build
        run: |
          npm install
          npm run build --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .
          # upload-artifact@v4 excludes hidden files by default. The Prisma
          # client is generated into node_modules/.prisma/ (a dot-dir) by the
          # postinstall `prisma generate`, so without this it is dropped from
          # the package and the app crashes at boot with
          # "Cannot find module '.prisma/client/default'".
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4AC0CB231AE641608C9DD825D4D84C57 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0B69A87B0876401CA7461A4D701E7C1E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E67BAFDB17C94FBFAEFD3D0EBDA7B75C }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'zendaapilinuxtesis'
          slot-name: 'Production'
          package: .

      - name: Seed isolated illustrative research cohort once
        shell: bash
        run: |
          set -euo pipefail

          resource_group="$(az webapp list \
            --query "[?name=='zendaapilinuxtesis'].resourceGroup | [0]" \
            --output tsv)"

          if [ -z "$resource_group" ]; then
            echo "Azure Web App resource group was not found."
            exit 1
          fi

          publish_user="$(az webapp deployment list-publishing-credentials \
            --name zendaapilinuxtesis \
            --resource-group "$resource_group" \
            --query publishingUserName \
            --output tsv)"
          publish_password="$(az webapp deployment list-publishing-credentials \
            --name zendaapilinuxtesis \
            --resource-group "$resource_group" \
            --query publishingPassword \
            --output tsv)"

          response_file="$(mktemp)"
          http_status="$(curl \
            --silent \
            --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --user "$publish_user:$publish_password" \
            --header 'Content-Type: application/json' \
            --data '{"command":"ALLOW_ILLUSTRATIVE_RESEARCH_SEED=true npm run prisma:seed:research-scenario","dir":"/home/site/wwwroot"}' \
            'https://zendaapilinuxtesis.scm.azurewebsites.net/api/command')"

          if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            echo "The one-time research cohort seed failed with HTTP $http_status."
            cat "$response_file"
            exit 1
          fi

          node -e "const fs=require('fs'); const result=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(result.Output || 'Seed completed.');" "$response_file"
